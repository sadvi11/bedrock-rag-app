name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-test:
    name: Lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 pytest

      # Blocking: only the errors that mean the code cannot run.
      - name: Lint (errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
             --exclude=lambda_build,infrastructure

      # Advisory: style findings are reported, not fatal.
      - name: Lint (style, advisory)
        run: flake8 . --count --exit-zero --max-line-length=100 --statistics
             --exclude=lambda_build,infrastructure

      # Gating. The earlier note here claimed the suite needed Bedrock and
      # Supabase credentials to pass, so the step was set to
      # continue-on-error. That was wrong: the tests mock both services and
      # run offline. The only failure was a stale assertion, and
      # continue-on-error hid it behind a green badge for the life of the
      # repository. A test step that cannot fail the build is decoration.
      - name: Run tests
        run: pytest tests/ -v

      - name: Build Lambda package
        run: |
          mkdir -p lambda_build
          pip install -r requirements.txt -t lambda_build/
          cp lambda/ingest.py rag.py bedrock_client.py lambda_build/
          cd lambda_build && zip -rq ../lambda.zip . -x "*.pyc" -x "__pycache__/*"
          echo "Lambda package size: $(du -sh ../lambda.zip | cut -f1)"

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda.zip
